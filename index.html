<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Красная Таблетка. Честный подкаст</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        button, a, [role="button"], .interactive-element {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        @keyframes soundWave {
            0%, 100% { height: 4px; }
            50% { height: 28px; }
        }
        .wave-bar {
            animation: soundWave 1.2s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { animation-delay: 0.6s; }
    </style>
</head>
<body class="bg-[#0B0F19] text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [step, setStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [time, setTime] = useState(100);
            const [business, setBusiness] = useState(15);
            const [energy, setEnergy] = useState(80);
            const [showModal, setShowModal] = useState(false);
            const [ttsSupported, setTtsSupported] = useState(true);
            const [showTtsAlert, setShowTtsAlert] = useState(false);
            const [targetClicks, setTargetClicks] = useState(0);
            const utteranceRef = useRef(null);

            const introText = "Новая экспертная встреча — с Романом Чекушовым, статс-секретарём, заместителем Министра промышленности и торговли РФ, членом клуба «Эльбрус»! Накануне участники нашего сообщества — активные управленцы, предприниматели — встретились на площадке Минпромторга РФ. Каждый смог задать волнующие вопросы Роману Чекушову и получить его экспертные ответы. Встреча прошла в рамках проекта «Помощь Клуба». В центре обсуждения были актуальные тенденции развития маркетплейсов и торговых сетей. Как отметил Роман Чекушов, российские бренды становятся все популярнее, а объемы производства отечественной продукции растут. Председатель клуба «Эльбрус» Татьяна Дьяконова напомнила о важности технологического суверенитета.";
            const transitionText = "Красивый пресс-релиз, правда? Атмосфера деловая... Но а как можно в реальности решить свой вопрос члену Сообщества, когда косты на логистику душат реальный бизнес? Давай проверим это на кейсе нашего героя — предпринимателя Нео. Нажмите 'Перейти к кейсу', чтобы начать квест.";
            
            const step3SuccessText = "Победа! Вы пробили хрустальный потолок, сэкономили время и масштабировали бизнес через силу горизонтального доверия.";
            const step3FailText = "Поражение. Вы увязли в бюрократическом болоте в одиночку. Ваше время истекло.";
            const step3Outro = "Кейс Нео доказал: сообщество эффективных лидеров — это не пафосные отчеты с трибун. Это рабочий инструмент горизонтального взаимодействия, который экономит ваше личное время за счет прямого доверия.";

            const stopVoice = () => {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                setIsPlaying(false);
            };

            useEffect(() => {
                if (!('speechSynthesis' in window)) {
                    setTtsSupported(false);
                }
                return () => stopVoice();
            }, []);

            const speak = (textToSpeak) => {
                if (!window.speechSynthesis) {
                    setTtsSupported(false);
                    setShowTtsAlert(true);
                    return;
                }

                window.speechSynthesis.cancel();

                if (isPlaying) {
                    setIsPlaying(false);
                    return;
                }

                try {
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.lang = 'ru-RU';

                    const voices = window.speechSynthesis.getVoices();
                    const ruVoice = voices.find(v => v.lang.includes('ru') || v.lang.includes('RU'));
                    if (ruVoice) {
                        utterance.voice = ruVoice;
                    }

                    utterance.onstart = () => setIsPlaying(true);
                    utterance.onend = () => setIsPlaying(false);
                    utterance.onerror = (e) => {
                        console.error("Speech error", e);
                        setIsPlaying(false);
                        setShowTtsAlert(true);
                    };

                    utteranceRef.current = utterance;
                    window.speechSynthesis.speak(utterance);
                } catch (err) {
                    console.error("TTS Init Error:", err);
                    setIsPlaying(false);
                    setShowTtsAlert(true);
                }
            };

            const handlePlayPause = () => {
                if (isPlaying) {
                    stopVoice();
                } else {
                    if (step === 0) {
                        speak(`${introText} ${transitionText}`);
                    } else if (step === 3) {
                        const finalResultText = business >= 75 ? step3SuccessText : step3FailText;
                        speak(`${finalResultText} ${step3Outro}`);
                    }
                }
            };

            const nextStep = (targetStep) => {
                stopVoice();
                setStep(targetStep);
            };

            const handleChoice = (timeChange, energyChange, businessChange) => {
                setTime(prev => Math.max(0, Math.min(100, prev + timeChange)));
                setEnergy(prev => Math.max(0, Math.min(100, prev + energyChange)));
                setBusiness(prev => Math.max(0, Math.min(100, prev + businessChange)));
                setStep(prev => prev + 1);
            };

            const handleRestart = () => {
                stopVoice();
                setTime(100);
                setBusiness(15);
                setEnergy(80);
                setStep(1);
            };

            const handleCTA = () => {
                setTargetClicks(prev => prev + 1);
                setShowModal(true);
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const ctaUtterance = new SpeechSynthesisUtterance("Спасибо! Ваш кейс принят. Будем ломать шаблоны вместе.");
                    ctaUtterance.lang = "ru-RU";
                    window.speechSynthesis.speak(ctaUtterance);
                }
            };

            return (
                <div class="min-h-[100dvh] w-full max-w-md mx-auto bg-[#0B0F19] p-4 flex flex-col justify-between text-white select-none">
                    
                    {/* ХЕДЕР */}
                    <header class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                            <span class="font-bold tracking-wider text-sm text-red-400 uppercase">Красная Таблетка</span>
                        </div>
                        <span class="text-xs bg-slate-800 border border-slate-700 px-2 py-1 rounded text-zinc-300 font-mono">
                            Эпизод 13
                        </span>
                    </header>

                    {/* ПАНЕЛЬ ПЛЕЕРА И СТАТИСТИКИ */}
                    <div class="my-4 bg-[#161F30] border border-[#24334C] p-4 rounded-xl shadow-lg">
                        
                        {/* Визуализатор звука */}
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs text-zinc-400 font-medium">Режим: {step === 0 || step === 3 ? "🎧 Аудиоподкаст" : "🎯 Интерактивный квест"}</span>
                            
                            <div class="flex items-end gap-1 h-8 px-2">
                                {isPlaying ? (
                                    [1, 2, 3, 4, 5].map((i) => (
                                        <div key={i} class="w-[3px] bg-violet-500 rounded-full wave-bar"></div>
                                    ))
                                ) : (
                                    <div class="text-xs text-zinc-500 italic">Без звука</div>
                                )}
                            </div>
                        </div>

                        {/* Кнопка воспроизведения */}
                        {(step === 0 || step === 3) && (
                            <div class="flex items-center justify-center gap-4 mb-6">
                                <button 
                                    onClick={handlePlayPause}
                                    class="w-16 h-16 rounded-full bg-gradient-to-r from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg active:scale-95 transition-transform"
                                >
                                    {isPlaying ? (
                                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                        </svg>
                                    ) : (
                                        <svg class="w-6 h-6 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M8 5v14l11-7z"/>
                                        </svg>
                                    )}
                                </button>
                                <div class="text-left">
                                    <p class="font-bold text-sm text-white">{step === 0 ? "Вступление: Минпромторг" : "Итоги симуляции"}</p>
                                    <p class="text-xs text-zinc-400">{isPlaying ? "Звучит честный эфир..." : "Нажмите для воспроизведения"}</p>
                                </div>
                            </div>
                        )}

                        {/* Шкалы ресурсов */}
                        <div class="space-y-3 pt-2 border-t border-slate-800">
                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span class="text-amber-400 font-medium flex items-center gap-1">⏱️ Бюджет времени Нео</span>
                                    <span class="font-mono font-bold text-white">{time}%</span>
                                </div>
                                <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
                                    <div class="bg-amber-500 h-full transition-all duration-500" style={{width: `${time}%`}}></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span class="text-emerald-400 font-medium flex items-center gap-1">📈 Ресурс бизнеса</span>
                                    <span class="font-mono font-bold text-white">{business}%</span>
                                </div>
                                <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
                                    <div class="bg-emerald-500 h-full transition-all duration-500" style={{width: `${business}%`}}></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span class="text-cyan-400 font-medium flex items-center gap-1">⚡ Жизненная энергия</span>
                                    <span class="font-mono font-bold text-white">{energy}%</span>
                                </div>
                                <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
                                    <div class="bg-cyan-500 h-full transition-all duration-500" style={{width: `${energy}%`}}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ПРЕДУПРЕЖДЕНИЕ ОБ ОТСУТСТВИИ СИНТЕЗА РЕЧИ */}
                    {showTtsAlert && (
                        <div class="bg-amber-950/90 border border-amber-800 p-3 rounded-lg text-xs text-amber-200 mb-3 flex items-center gap-2">
                            <span>⚠️</span>
                            <p><strong>Режим чтения:</strong> Аудио-движок заблокирован вашим устройством или браузером (например, из-за ограничений Gbox/Huawei). Вы можете полноценно пройти тест, читая тексты на экране.</p>
                        </div>
                    )}

                    {/* ЦЕНТРАЛЬНАЯ СЮЖЕТНАЯ ЗОНА */}
                    <main class="flex-grow flex flex-col justify-center my-2">
                        <div class="bg-[#161F30] border border-[#24334C] p-5 rounded-xl shadow-lg text-left">
                            
                            {/* ШАГ 0: ПРЕСС-РЕЛИЗ */}
                            {step === 0 && (
                                <div class="space-y-4">
                                    <h2 class="text-sm font-bold text-violet-400 uppercase tracking-wider">Официальная сводка:</h2>
                                    <p class="text-sm text-zinc-100 leading-relaxed max-h-48 overflow-y-auto pr-1">
                                        {introText}
                                    </p>
                                    <div class="border-t border-slate-800 pt-3">
                                        <p class="text-sm text-amber-200 italic font-medium leading-relaxed">
                                            {transitionText}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => nextStep(1)}
                                        class="w-full py-3 bg-white text-slate-950 font-bold rounded-lg text-center shadow-md active:scale-95 transition-all text-sm uppercase tracking-wider"
                                    >
                                        Перейти к кейсу
                                    </button>
                                </div>
                            )}

                            {/* ШАГ 1: ЛОГИСТИКА */}
                            {step === 1 && (
                                <div class="space-y-4">
                                    <div class="bg-slate-950 px-3 py-1 rounded text-[10px] text-zinc-400 font-mono uppercase inline-block">Шаг 1: Логистика</div>
                                    <p class="text-base text-white font-medium leading-relaxed">
                                        Нео запустил бренд бытовой химии во Владивостоке. Продукт отличный, но везти его в федеральные сети на запада страны безумно дорого. Московские конкуренты давят ценой. Время поджимает. Что делаешь?
                                    </p>
                                    <div class="space-y-3 pt-2">
                                        <button 
                                            onClick={() => handleChoice(-40, -50, 5)}
                                            class="w-full text-left p-3.5 rounded-lg border border-[#24334C] hover:border-violet-500 bg-slate-950 text-sm text-zinc-100 font-medium active:bg-slate-900 transition-colors"
                                        >
                                            Подать официальный пакет документов на получение государственной субсидии на логистику.
                                        </button>
                                        <button 
                                            onClick={() => handleChoice(-5, -10, 45)}
                                            class="w-full text-left p-3.5 rounded-lg border border-[#24334C] hover:border-violet-500 bg-slate-950 text-sm text-zinc-100 font-medium active:bg-slate-900 transition-colors"
                                        >
                                            Разместить запрос о поиске попутных грузов или совместной аренде контейнеров в чате выпускников конкурса.
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* ШАГ 2: ХАБ */}
                            {step === 2 && (
                                <div class="space-y-4">
                                    <div class="bg-slate-950 px-3 py-1 rounded text-[10px] text-zinc-400 font-mono uppercase inline-block">Шаг 2: Выделение земли</div>
                                    <p class="text-base text-white font-medium leading-relaxed">
                                        Для масштабирования проекта вам необходим собственный логистический хаб. Губернатор на личной встрече концептуально поддержал проект, но реальное выделение участка земли затягивается аппаратом на неопределенный срок. Ваши действия?
                                    </p>
                                    <div class="space-y-3 pt-2">
                                        <button 
                                            onClick={() => handleChoice(-40, -30, 0)}
                                            class="w-full text-left p-3.5 rounded-lg border border-[#24334C] hover:border-violet-500 bg-slate-950 text-sm text-zinc-100 font-medium active:bg-slate-900 transition-colors"
                                        >
                                            Направить официальный запрос в аппарат правительства региона и ожидать рассмотрения по регламенту.
                                        </button>
                                        <button 
                                            onClick={() => handleChoice(-10, 15, 35)}
                                            class="w-full text-left p-3.5 rounded-lg border border-[#24334C] hover:border-violet-500 bg-slate-950 text-sm text-zinc-100 font-medium active:bg-slate-900 transition-colors"
                                        >
                                            Найти в базе выпускников конкурса сотрудника администрации этого региона и обратиться за рабочей консультацией.
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* ШАГ 3: ИТОГИ И МЕТРИКИ */}
                            {step === 3 && (
                                <div class="space-y-5">
                                    <div class="text-center">
                                        {business >= 75 ? (
                                            <div class="inline-block px-4 py-2 rounded-full bg-emerald-950 border border-emerald-500 text-emerald-400 text-sm font-bold uppercase tracking-wider mb-2">
                                                🎉 Успех проекта
                                            </div>
                                        ) : (
                                            <div class="inline-block px-4 py-2 rounded-full bg-red-950 border border-red-500 text-red-400 text-sm font-bold uppercase tracking-wider mb-2">
                                                💀 Крах проекта
                                            </div>
                                        )}
                                        <p class="text-base font-bold text-white mt-1 leading-relaxed">
                                            {business >= 75 ? step3SuccessText : step3FailText}
                                        </p>
                                    </div>

                                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                                        <p class="text-sm text-zinc-100 leading-relaxed">
                                            {step3Outro}
                                        </p>
                                    </div>

                                    {/* КНОПКИ ДЕЙСТВИЯ */}
                                    <div class="space-y-3 pt-2">
                                        <button 
                                            onClick={handleCTA}
                                            class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-extrabold rounded-lg shadow-md hover:from-emerald-400 hover:to-teal-500 active:scale-95 transition-all text-sm uppercase tracking-wider text-center"
                                        >
                                            Предложить свой сложный кейс
                                        </button>
                                        
                                        <button 
                                            onClick={handleRestart}
                                            class="w-full py-3 px-4 bg-slate-800 border border-slate-700 text-white font-bold rounded-lg shadow-sm hover:bg-slate-700 active:scale-95 transition-all text-sm uppercase tracking-wider text-center"
                                        >
                                            🔄 Пройти заново
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* МОДАЛЬНОЕ ОКНО */}
                    {showModal && (
                        <div class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
                            <div class="bg-[#161F30] border border-emerald-500 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
                                <div class="w-12 h-12 bg-emerald-950 border border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                    ✓
                                </div>
                                <h3 class="text-lg font-bold text-white mb-2">Кейс отправлен в редакцию!</h3>
                                <p class="text-sm text-zinc-300 leading-relaxed mb-6">
                                    Ваш кейс принят редакцией Журнала Действия. Мы свяжемся с вами, чтобы превратить вашу проблему в следующее эффективное решение.
                                </p>
                                <button 
                                    onClick={() => setShowModal(false)}
                                    class="w-full py-2 bg-emerald-500 text-slate-950 font-bold rounded-lg active:scale-95 transition-transform"
                                >
                                    Закрыть окно
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ТЕХНИЧЕСКИЙ ВИДЖЕТ */}
                    <footer class="mt-4 pt-3 border-t border-slate-800 text-center">
                        <div class="inline-flex items-center gap-2 bg-slate-950 px-3 py-1 rounded-full border border-slate-800">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></div>
                            <span class="text-[10px] text-zinc-400 font-mono">
                                Зарегистрировано кликов на отправку кейсов: <strong class="text-emerald-400 font-bold">{targetClicks}</strong>
                            </span>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
